
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Are.na Style Synthesizer</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="/index.css" rel="stylesheet">
    <style>
      .animate-mesh {
        /* Palette: Light Gray -> Light Blue -> Medium Blue -> Dark Blue -> Dark Gray */
        background: linear-gradient(-45deg, #cbd5e1, #93c5fd, #3b82f6, #1e3a8a, #374151);
        background-size: 400% 400%;
      }
      .dark .animate-mesh {
        /* Dark mode palette: Darker variations of Gray and Blue */
        background: linear-gradient(-45deg, #1f2937, #1e3a8a, #172554, #1e40af, #0f172a);
        background-size: 400% 400%;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
</head>
  <body class="bg-arena-cream text-arena-charcoal font-mono antialiased selection:bg-arena-green selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
