steps:
# Step 1: Pull the previous image to use as a cache.
# This step attempts to pull an image tagged 'latest'. If it doesn't exist (e.g., first build),
# the '|| exit 0' ensures the build doesn't fail.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - 'docker pull us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:latest || exit 0'

# Step 2: Build the image using the cached layers and tag it with COMMIT_SHA and 'latest'.
# The '--cache-from' argument tells Docker to use the pulled 'latest' image as a cache source.
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:$COMMIT_SHA'
    - '-t' # Add a 'latest' tag for subsequent caching
    - 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:latest'
    - '.'

# Step 3: Push the image tagged with COMMIT_SHA to Artifact Registry.
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:$COMMIT_SHA']

# Step 4: Push the image tagged with 'latest' to Artifact Registry.
# This ensures the 'latest' tag is always updated for future cache-from operations.
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:latest']

# Step 5: Deploy the image to Cloud Run.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'are-na-style-synthesizer'
    - '--image'
    - 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:$COMMIT_SHA'
    - '--source'
    - 'NONE'
    - '--region'
    - 'us-west1'
    - '--port'
    - '3000'

images:
  # Both tags should be listed here so Cloud Build knows to track them
  - 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/gen-lang-client-0447363070/cloud-run-source-deploy/are-na-style-synthesizer:latest'
options:
  logging: CLOUD_LOGGING_ONLY

# Optional: Add a timeout for the entire build
timeout: '10m' # e.g., 10 minutes